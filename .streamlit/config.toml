# Streamlit settings for the page (speakertimer.web), locally and on
# Streamlit Community Cloud. Read from the current directory: run from the
# project's root.

[server]
# No browser opened by the server itself, and no e-mail prompt on first run.
headless = true

[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[client]
# Visitors see the page, not the developer menu.
toolbarMode = "viewer"

[theme]
base = "light"
